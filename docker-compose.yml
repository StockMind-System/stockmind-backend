services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MongoDb__ConnectionString: mongodb://mongo:27017
      MongoDb__DatabaseName: stockmind
      Analytics__BaseUrl: ${ANALYTICS_BASE_URL:-http://host.docker.internal:8000}
      Jwt__Key: ${JWT_KEY:-development-key-change-this-1234567890}
      Jwt__Issuer: StockMind
      Jwt__Audience: StockMind.Client
    depends_on:
      - mongo
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
