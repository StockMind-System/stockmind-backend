services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MongoDb__ConnectionString: mongodb://host.docker.internal:27017
      MongoDb__DatabaseName: stockmind
      MongoDb__InitializeOnStartup: "true"
      SeedData__Enabled: "true"
      SeedData__RandomSeed: "202610"
      SeedData__Version: "2026.10"
      SeedData__DefaultPassword: ${SEED_DEFAULT_PASSWORD:-StockMind-123}
      Analytics__BaseUrl: ${ANALYTICS_BASE_URL:-http://host.docker.internal:8000}
      Jwt__Key: ${JWT_KEY:-development-key-change-this-1234567890}
      Jwt__Issuer: StockMind
      Jwt__Audience: StockMind.Client
    extra_hosts:
      - "host.docker.internal:host-gateway"
